<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tour Virtual | Polaco Lanches</title>
<meta name="description" content="Passeie em 360° pela fachada, salão, caixa e cozinha da Polaco Lanches, em Maringá.">
<meta name="theme-color" content="#14100e">
<link rel="icon" href="assets/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/pannellum/pannellum.css">
<style>
  :root { --red: #c8202b; --mustard: #f6b91a; --cream: #fbf3e6; --ink: #14100e; --glass: rgba(20,16,14,.82); --line: rgba(255,255,255,.2); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--cream); font: 500 15px/1.3 "DM Sans", system-ui, sans-serif; overflow: hidden; }
  #pano { position: fixed; inset: 0; width: 100%; height: 100%; }
  .pnlm-load-box { background: var(--glass); border-radius: 10px; }
  button, .link { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }

  #bar { position: fixed; z-index: 5; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  .title { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 5px 16px 5px 5px; border-radius: 99px; background: var(--glass); color: #fff; text-decoration: none; }
  .pnlm-panorama-info { display: none !important; }
  .title img { width: 40px; height: 40px; border-radius: 50%; background: #fff; flex: none; }
  .title small { display: block; color: var(--mustard); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .title b { display: block; font: 400 1.12rem/1.1 "Anton", Impact, sans-serif; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; gap: 6px; flex: none; }
  .ic { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--glass); color: #fff; text-decoration: none; }
  .ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ic[aria-pressed="true"] { background: var(--mustard); color: var(--ink); }
  .order { display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 99px; background: var(--red); color: #fff; font-weight: 700; text-decoration: none; }

  #dock { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; padding: 26px 0 max(10px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(20,16,14,.86) 45%); display: flex; align-items: center; gap: 6px; }
  #strip { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 3px; scrollbar-width: none; }
  #strip::-webkit-scrollbar { display: none; }
  #strip button { position: relative; flex: none; width: 118px; height: 66px; padding: 0; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; background: #000; }
  #strip img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .82; }
  #strip span { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 6px 3px; background: linear-gradient(transparent, rgba(0,0,0,.85)); color: #fff; font-size: .75rem; font-weight: 700; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #strip button[aria-current="true"] { border-color: var(--mustard); }
  #strip button[aria-current="true"] img { opacity: 1; }
  .nav { flex: none; margin-inline: 6px; }

  .hs { width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: var(--red); border: 3px solid #fff; box-shadow: 0 4px 16px rgba(0,0,0,.55); cursor: pointer; display: grid; place-items: center; animation: pulse 1.8s infinite; }
  .hs::before { content: ""; width: 12px; height: 12px; margin-top: 5px; border-left: 4px solid #fff; border-top: 4px solid #fff; transform: rotate(45deg); }
  .hs span { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); padding: 3px 10px; border-radius: 99px; background: var(--glass); color: #fff; font: 700 13px "DM Sans", sans-serif; white-space: nowrap; pointer-events: none; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(200,32,43,.6), 0 4px 16px rgba(0,0,0,.55); } 60% { box-shadow: 0 0 0 14px rgba(200,32,43,0), 0 4px 16px rgba(0,0,0,.55); } }

  #err { position: fixed; z-index: 9; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; background: var(--ink); }
  body.embed .order, body.embed .title small { display: none; }
  body.embed #strip button { width: 92px; height: 54px; }
  body.embed .title img { width: 32px; height: 32px; }
  body.embed .title b { font-size: .98rem; }
  @media (max-width: 560px) { .order { display: none; } #strip button { width: 98px; height: 58px; } .nav { display: none; } #strip { padding-inline: 10px; } }
  @media (prefers-reduced-motion: reduce) { .hs { animation: none; } }
</style>
</head>
<body>
<div id="pano" role="application" aria-label="Tour virtual em 360 graus. Arraste para olhar ao redor."></div>

<div id="bar">
  <a class="title" id="home" href="index.html" aria-label="Voltar ao site da Polaco Lanches">
    <img src="assets/img/logo.jpg" alt="" width="40" height="40">
    <span><small>Tour virtual 360°</small><b id="name"></b></span>
  </a>
  <div class="tools">
    <a class="order" href="index.html#pedir" target="_top">Fazer pedido</a>
    <button class="ic" id="spin" type="button" aria-pressed="true" aria-label="Giro automático"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
    <button class="ic" id="full" type="button" aria-label="Tela cheia"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>

<div id="dock">
  <button class="ic nav" id="prev" type="button" aria-label="Ambiente anterior"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
  <div id="strip" role="group" aria-label="Ambientes do tour"></div>
  <button class="ic nav" id="next" type="button" aria-label="Próximo ambiente"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
</div>
<div id="err"><p>Não foi possível abrir o tour neste navegador.<br>Atualize a página ou tente em outro navegador.</p></div>

<script src="assets/vendor/pannellum/pannellum.js"></script>
<script>
const SCENES = [
  { id: "01-esquina", name: "Esquina", yaw: -9, spots: [["02-rua", "Ir para a rua", 45, -10]] },
  { id: "02-rua", name: "Rua da loja", yaw: -9, spots: [["03-calcada", "Ir para as mesas", -5, -8]] },
  { id: "03-calcada", name: "Mesas na calçada", yaw: -2, spots: [["06-entrada", "Entrar", -2, -3]] },
  { id: "06-entrada", name: "Entrada", yaw: -9, spots: [["08-mural", "Ver o mural", -9, -4], ["03-calcada", "Sair para a calçada", -144, -4]] },
  { id: "07-mesa-salao", name: "Mesa do salão", yaw: -9, spots: [["08-mural", "Ver o mural", -9, -3]] },
  { id: "08-mural", name: "Mural", yaw: 0, spots: [["09-salao", "Seguir pelo salão", 99, -3]] },
  { id: "09-salao", name: "Salão", yaw: -22, spots: [["11-caixa", "Ir ao caixa", 155, -4]] },
  { id: "11-caixa", name: "Caixa", yaw: -14, spots: [["12-cozinha", "Ver a cozinha", 9, -2]] },
  { id: "12-cozinha", name: "Cozinha", yaw: -45, spots: [["11-caixa", "Voltar ao caixa", 108, -3]] },
  { id: "10-salao-noite", name: "Salão à noite", yaw: -30, spots: [["04-fachada-noite", "Sair para a fachada", 67, -3]] },
  { id: "04-fachada-noite", name: "Fachada à noite", yaw: -31, spots: [["05-lateral-noite", "Ver a lateral", -108, -5]] },
  { id: "05-lateral-noite", name: "Lateral à noite", yaw: 0, spots: [["04-fachada-noite", "Ver a fachada", 41, -4]] },
];

const params = new URLSearchParams(location.search);
const embed = params.has("embed");
document.body.classList.toggle("embed", embed);
if (embed) { const h = document.getElementById("home"); h.href = "tour.html"; h.target = "_blank"; h.rel = "noopener"; h.setAttribute("aria-label", "Abrir o tour em nova aba"); }

const label = (div, text) => { const s = document.createElement("span"); s.textContent = text; div.appendChild(s); div.setAttribute("aria-label", text); };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let spinning = !reduce;
const first = SCENES.some(s => s.id === params.get("cena")) ? params.get("cena") : "03-calcada";

const scenes = Object.fromEntries(SCENES.map(s => [s.id, {
  title: s.name, type: "equirectangular", panorama: `tour/pano/${s.id}.jpg`, yaw: s.yaw, pitch: 0, hfov: innerWidth < 700 ? 100 : 105,
  hotSpots: s.spots.map(([sceneId, text, yaw, pitch]) => ({ type: "scene", sceneId, yaw, pitch, cssClass: "hs", createTooltipFunc: label, createTooltipArgs: text })),
}]));

const viewer = pannellum.viewer("pano", {
  default: { firstScene: first, sceneFadeDuration: 700, autoLoad: true, showControls: false, compass: false, minHfov: 45, maxHfov: 120, autoRotate: spinning ? -1.6 : false, autoRotateInactivityDelay: 5000, strings: { loadingLabel: "Carregando..." } },
  scenes,
});

const strip = document.getElementById("strip");
strip.innerHTML = SCENES.map(s => `<button type="button" data-id="${s.id}"><img src="tour/thumb/${s.id}.jpg" alt="" width="320" height="160" loading="lazy"><span>${s.name}</span></button>`).join("");
strip.addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.id); });
function go(id) { if (id !== viewer.getScene()) viewer.loadScene(id); }
function step(d) { const i = SCENES.findIndex(s => s.id === viewer.getScene()); go(SCENES[(i + d + SCENES.length) % SCENES.length].id); }
function mark(id) {
  document.getElementById("name").textContent = SCENES.find(s => s.id === id).name;
  [...strip.children].forEach(b => { const on = b.dataset.id === id; b.setAttribute("aria-current", on); if (on) strip.scrollTo({ left: b.offsetLeft - strip.clientWidth / 2 + b.offsetWidth / 2, behavior: reduce ? "auto" : "smooth" }); });
}
mark(first);
viewer.on("scenechange", mark);
viewer.on("load", () => { if (spinning) viewer.startAutoRotate(-1.6); else viewer.stopAutoRotate(); });
viewer.on("error", () => { document.getElementById("err").style.display = "grid"; });
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
const spin = document.getElementById("spin");
spin.setAttribute("aria-pressed", spinning);
spin.onclick = () => { spinning = !spinning; spin.setAttribute("aria-pressed", spinning); if (spinning) viewer.startAutoRotate(-1.6); else viewer.stopAutoRotate(); };
document.getElementById("full").onclick = () => viewer.toggleFullscreen();
</script>
</body>
</html>
